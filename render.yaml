services:
  - type: web
    name: ecommerce-recommendation-api
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
    plan: free
